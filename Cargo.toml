[package]
name = "consola"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "🐨 Elegant Console Logger for Rust and Browser"
readme = "README.md"
repository = "https://github.com/MuntasirSZN/consola-rs"
license = "MIT"
keywords = ["ansi", "console", "logging", "wasm"]
categories = ["development-tools"]

[package.metadata.cargo-nextest.profile.default]
fail-fast = false
retries = 1
junit = { path = "junit.xml" }

[features]
default = ["backtrace", "jiff"]
backtrace = ["dep:backtrace"]
browser = ["dep:wasm-bindgen", "dep:web-sys"]
jiff = ["dep:jiff"]
log = ["dep:log"]
parking_lot = ["dep:parking_lot"]
prompt = ["dep:demand"]
prompt-dialoguer = ["dep:dialoguer"]
prompt-inquire = ["dep:inquire"]
time = ["dep:time"]
tracing = ["dep:tracing", "dep:tracing-core"]

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "error"
path = "examples/error.rs"

[[example]]
name = "box"
path = "examples/box.rs"

[[example]]
name = "custom_reporter"
path = "examples/custom_reporter.rs"

[[example]]
name = "json"
path = "examples/json.rs"

[[bench]]
harness = false
name = "log_bench"

[dependencies]
anstyle = "1"
backtrace = { version = "0.3", optional = true }
demand = { version = "2", optional = true }
dialoguer = { version = "0.12", optional = true }
inquire = { version = "0.9", optional = true }
jiff = { version = "1", features = ["js"], optional = true }
log = { version = "0.4", optional = true }
parking_lot = { version = "0.12", optional = true }
terminal_size = "0.4"
thiserror = "2"
time = { version = "0.3", features = ["local-offset"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-core = { version = "0.1", optional = true }
unicode-width = "0.2"
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["Window", "console"], optional = true }

[dev-dependencies]
console_error_panic_hook = "0.1"
divan = { package = "codspeed-divan-compat", version = "6" }
parking_lot = "0.12"
serde_json = "1"
wasm-bindgen-test = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.bench]
lto = true
codegen-units = 1
